<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helper test — Matt Bloomfield</title>
<meta name="description" content="Workspace v2 Slice 0 test: can this site reach the desktop helper, read DE through it and save a PDF into Drive.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../assets/logos/monogram.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/logos/monogram-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/logos/apple-touch-icon-180.png">
<!-- Self-hosted STATIC fonts. See assets/css/fonts.css. -->
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<style>
  .app { max-width: 760px; margin: 32px auto 0; display: grid; gap: 18px; }
  .lab-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .lab-row label { font-family: var(--mono); font-size: 13px; }
  .lab-row input { font: inherit; font-family: var(--mono); width: 9ch; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink); }
  .lab-state { font-family: var(--mono); font-size: 13px; }
  .lab-log { font-family: var(--mono); font-size: 12px; line-height: 1.6; background: var(--paper-2); border-radius: 8px; padding: 14px 16px; min-height: 160px; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body data-root="../../" data-nav="tools">
<main class="page">
  <div class="page-head" data-reveal>
    <h1>Helper test</h1>
    <span class="t-mono">Slice 0 · the desktop helper: reach it, read DE, save a PDF</span>
  </div>
  <div class="app">
    <p class="lab-state">Helper: <b id="state">checking…</b></p>
    <div class="lab-row">
      <label for="code">Pairing code</label>
      <input id="code" inputmode="numeric" autocomplete="off" maxlength="6">
      <button class="btn" type="button" id="pair">Pair</button>
      <button class="btn" type="button" id="health">Check helper</button>
    </div>
    <div class="lab-row">
      <button class="btn" type="button" id="dry">DE dry run</button>
      <button class="btn" type="button" id="a5">Save sample showsheet (A5)</button>
      <button class="btn" type="button" id="letter">Save sample showsheet (Letter)</button>
      <button class="btn" type="button" id="bad">Try a Shared drives folder</button>
    </div>
    <div class="lab-log" id="log" aria-live="polite"></div>
  </div>
</main>
<script src="../../assets/js/chrome.js"></script>
<script>
(function () {
  'use strict';
  var BASE = 'http://localhost:47610', KEY = 'gvc.helper.pair';
  var LAB = 'G:\\My Drive\\GVC Workspace Lab';
  var $ = function (id) { return document.getElementById(id); };

  function log(msg) { $('log').textContent += new Date().toISOString().slice(11, 19) + '  ' + msg + '\n'; }
  function code() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }

  function call(method, path, body) {
    return fetch(BASE + path, {
      method: method,
      headers: { 'content-type': 'application/json', 'x-gvc-pair': code() },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json(); }, function () {
      throw new Error('The helper isn\'t running on this PC (or Chrome blocked the local connection).');
    });
  }

  function health() {
    return call('GET', '/health').then(function (r) {
      $('state').textContent = 'running, version ' + r.version + (r.paired ? ', paired' : ', not paired yet');
      log('health: ' + JSON.stringify(r));
    }).catch(function (e) { $('state').textContent = 'not reachable'; log(e.message); });
  }

  function act(id, fn) {
    $(id).addEventListener('click', function () {
      $(id).disabled = true;
      Promise.resolve().then(fn).catch(function (e) { log('error: ' + e.message); })
        .then(function () { $(id).disabled = false; });
    });
  }

  $('code').value = code();
  act('pair', function () {
    try { localStorage.setItem(KEY, $('code').value.trim()); } catch (e) { log('this browser won\'t store the code'); }
    return health();
  });
  act('health', health);
  act('dry', function () {
    log('dry run started (about 30 s)…');
    return call('POST', '/de/dry-run', {}).then(function (r) {
      if (!r.ok) { log('dry run ABORTED: ' + (r.aborted || r.error)); return; }
      Object.keys(r.totals).forEach(function (k) { log('  ' + k + ': DE ' + r.totals[k] + ', read ' + r.rowsRead[k]); });
      log('  statuses: ' + r.statusesSeen.join(', '));
      log('  live: ' + r.live.length + ', matched to a folder: ' + r.live.filter(function (x) { return x.folder; }).length);
      log('  report: exports/de-dry-run-' + r.date + '.md on the PC');
    });
  });
  function save(paper) {
    return call('GET', '/lab/samples').then(function (s) {
      log('saving sample showsheet (' + paper + ')…');
      return call('POST', '/pdf', { tool: 'showsheet', inputs: s.inputs, paper: paper, outDir: LAB });
    }).then(function (r) { log(r.ok ? 'saved ' + r.path + ' (' + r.pages + ' pages)' : 'not saved: ' + r.error); });
  }
  act('a5', function () { return save('a5'); });
  act('letter', function () { return save('letter'); });
  act('bad', function () {
    return call('GET', '/lab/samples').then(function (s) {
      return call('POST', '/pdf', { tool: 'showsheet', inputs: s.inputs, paper: 'a5', outDir: 'G:\\Shared drives\\GVC - New York' });
    }).then(function (r) { log(r.ok ? 'PROBLEM: it wrote to ' + r.path : 'refused as it should be: ' + r.error); });
  });

  health();
})();
</script>
</body>
</html>
