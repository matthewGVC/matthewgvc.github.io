<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jobs · GVC Workspace (mockup)</title>
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="shell.css">
<style>
.pg{max-width:1200px;margin:0 auto;padding:24px 24px 64px;width:100%}
.pg h1{font-size:40px;line-height:1}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--ink);margin-top:20px;flex-wrap:wrap}
.tabs a{font-family:var(--sans-display);font-weight:800;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-soft);padding:10px 0 8px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--sky)}
.tabs a span{font-family:var(--mono);font-weight:400;letter-spacing:0;margin-left:4px}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{text-align:left;font-family:var(--sans-display);font-weight:800;font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);padding:12px 10px 8px 0;border-bottom:1px solid var(--rule)}
td{padding:12px 10px 12px 0;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:baseline}
td.nm a{font-family:var(--serif);font-size:17px}
td.nm a:hover{text-decoration:underline;text-underline-offset:3px}
td.mono{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.stale{font-family:var(--sans-display);font-weight:800;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;background:var(--ink);color:var(--bone);padding:2px 6px;border-radius:3px}
tr:hover td{background:var(--paper-2)}
@media (max-width:720px){ .pg{padding:16px} .hide-s{display:none} }
</style>
</head>
<body data-nav="jobs">
<main class="pg">
  <h1>Jobs</h1>
  <nav class="tabs" id="tabs" aria-label="Job type"></nav>
  <table><thead><tr><th>Job</th><th>Market</th><th>Stage</th><th class="hide-s">DE</th><th class="hide-s">Kit</th><th class="hide-s">Folder</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script src="data.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  var M = window.MOCK;
  var T = { listings: ['Listings', function (j) { return j.type === 'listing' || j.type === 'rental'; }],
            pitches: ['Pitches', function (j) { return j.type === 'pitch'; }],
            developments: ['Developments', function (j) { return j.type === 'development'; }] };
  function render() {
    var k = (location.hash || '#listings').slice(1); if (!T[k]) k = 'listings';
    document.getElementById('tabs').innerHTML = Object.keys(T).map(function (x) {
      return '<a href="#' + x + '" aria-current="' + (x === k) + '">' + T[x][0] + '<span>' + M.jobs.filter(T[x][1]).length + '</span></a>';
    }).join('');
    document.getElementById('rows').innerHTML = M.jobs.filter(T[k][1]).map(function (j) {
      var de = j.de ? (j.de.status + (j.de.price ? ' · ' + j.de.price : '')) : (j.type === 'development' ? 'n/a' : 'Not on DE');
      var kit = j.type === 'development' ? 'Overview only' : (j.stale ? '<span class="stale">' + j.stale + ' stale</span>' : (j.work && j.work.length ? j.work.length + ' items' : 'Nothing made'));
      return '<tr><td class="nm"><a href="job.html#' + j.id + '">' + j.name + '</a>' + (j.place ? ' <span class="mono">' + j.place + '</span>' : '') + '</td><td class="mono">' + j.market + (j.type === 'rental' ? ' · rental' : '') + '</td><td>' + j.stage + '</td><td class="hide-s">' + de + '</td><td class="hide-s">' + kit + '</td><td class="mono hide-s">' + (j.folderMissing ? 'Not linked' : 'Linked') + '</td></tr>';
    }).join('');
  }
  window.addEventListener('hashchange', render); render();
})();
</script>
</body>
</html>
