<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NJ Footprint — Matt Bloomfield</title>
<meta name="description" content="A one-page, print-ready map of where The GVC Team sells in New Jersey, and how much business it has done.">
<meta property="og:title" content="NJ Footprint — Matt Bloomfield">
<meta property="og:description" content="Where The GVC Team works in New Jersey: counties, closed sales and dollar volume.">
<meta property="og:url" content="https://matthewgvc.github.io/tools/nj-footprint/">
<meta property="og:type" content="website">
<link rel="icon" href="../../assets/logos/monogram.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/logos/monogram-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/logos/apple-touch-icon-180.png">
<!-- Self-hosted STATIC fonts: Chrome turns variable fonts into Type3 outlines when printing
     to PDF. Do not put a fonts.googleapis.com link back on this page. See assets/css/fonts.css. -->
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/builder.css">
<style>
/* ============================================================
   NJ FOOTPRINT — one Letter page. The builder shell (builder.css) gives the preview well,
   the bottom bar and the print rules; this tool has no editor panel, so the shell is
   collapsed to a single column. Everything the sheet prints is drawn from transactions.js.
   ============================================================ */
#app{grid-template-columns:minmax(0,1fr);}
#stage,#stageBar{grid-column:1;}
@media print{ #stageBar{display:none !important;} }

.sheet{--pad:.55in;width:var(--pw);height:var(--ph);background:#fff;color:var(--navy);
  display:flex;flex-direction:column;overflow:hidden;position:relative;}
.sheet *{box-sizing:border-box;}

/* head */
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;padding:.5in var(--pad) 0;}
.hd .lockup{width:1.75in;display:block;}
.hd .meta{font:800 7.5pt var(--sans);letter-spacing:.2em;text-transform:uppercase;color:rgba(0,39,58,.55);text-align:right;}

.title{flex:none;padding:.26in var(--pad) 0;}
.title h1{margin:0;font:300 40pt/1 var(--serif);letter-spacing:-.01em;}
.title h1 em{font-style:italic;font-weight:300;}
.title p{margin:.1in 0 0;max-width:6.2in;font:300 11pt/1.45 var(--body);color:var(--ui-ink-soft);}

/* headline numbers */
.hero{flex:none;display:flex;margin:.2in var(--pad) 0;border-top:1px solid var(--navy);border-bottom:1px solid var(--rule);}
.hero .stat{flex:1;padding:.11in 0 .12in;}
.hero .stat + .stat{padding-left:.3in;border-left:1px solid var(--rule);}
.stat .n{font:300 34pt/1 var(--serif);font-variant-numeric:lining-nums tabular-nums;}
.stat .l{margin-top:.07in;font:800 7.5pt var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ui-ink-soft);}

/* map + panel */
.body{flex:1;min-height:0;display:grid;grid-template-columns:4.45in 1fr;gap:.25in;padding:.16in var(--pad) 0;}
.mapcol{min-height:0;display:flex;align-items:center;justify-content:center;}
.mapcol svg{display:block;width:100%;height:100%;}
.county{stroke:#fff;stroke-width:.9;stroke-linejoin:round;}
.county.none{fill:#E7E4DC;}
.county.active{fill:#53C7DC;}
.county.core{fill:#00273A;}
.cnum{font:800 14px var(--sans);fill:#00273A;text-anchor:middle;dominant-baseline:central;}
.lead{stroke:#00273A;stroke-width:.8;fill:none;}
.lead-dot{fill:#00273A;}
.lbl-n{font:800 14px var(--sans);letter-spacing:.14em;fill:#00273A;}
.lbl-v{font:400 13px var(--body);fill:#33525F;}

.panel{min-width:0;display:flex;flex-direction:column;padding-top:.04in;}
.eyebrow{font:800 7.5pt var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ui-ink-soft);margin:0 0 .09in;}
.core{display:flex;flex-direction:column;gap:.1in;}
.core .c{border-left:3px solid var(--navy);padding:.02in 0 .02in .14in;}
.core .nm{font:300 13.5pt/1.1 var(--serif);white-space:nowrap;}
.core .fig{margin-top:.04in;font:300 9pt/1.4 var(--body);color:var(--ui-ink-soft);font-variant-numeric:tabular-nums;}
.core .fig b{font-weight:700;color:var(--navy);}
.also{margin-top:.2in;}
.also ul{list-style:none;margin:0;padding:0;}
.also li{display:flex;align-items:baseline;gap:.08in;padding:.045in 0;border-bottom:1px solid var(--rule);font:400 9pt var(--body);}
.also li:last-child{border-bottom:0;}
.also .sw{flex:none;width:.1in;height:.1in;border-radius:2px;background:#53C7DC;transform:translateY(1px);}
.also .cn{flex:1;}
.also .cv{color:var(--ui-ink-soft);font-variant-numeric:tabular-nums;}
.team{flex:none;margin:.14in var(--pad) 0;display:grid;grid-template-columns:.9in repeat(3,1fr);gap:.22in;align-items:center;border-top:1px solid var(--rule);padding-top:.13in;}
.team .eyebrow{margin:0;}
.ag{display:flex;align-items:center;gap:.11in;}
.ag img{flex:none;width:.4in;height:.4in;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--paper-2);}
.ag .who{flex:1;min-width:0;}
.ag .an{font:800 9pt var(--sans);letter-spacing:.02em;white-space:nowrap;}
.ag .av{margin-top:.02in;font:300 8.5pt/1.3 var(--body);color:var(--ui-ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
.ag .av b{font-weight:700;color:var(--navy);}
.ag .bar{margin-top:.05in;height:3px;background:var(--rule);border-radius:2px;}
.ag .bar i{display:block;height:100%;background:var(--navy);border-radius:2px;}

/* snowbird band */
.snow{flex:none;margin:.16in var(--pad) 0;background:var(--navy);color:var(--bone);border-radius:2px;padding:.17in .3in;display:flex;align-items:center;gap:.35in;}
.snow .k{flex:none;width:1.45in;font:800 7.5pt/1.5 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#53C7DC;}
.snow p{margin:0;font:300 10.5pt/1.45 var(--body);}
.snow p b{font-weight:600;color:#fff;}

/* foot */
.ft{flex:none;display:flex;align-items:center;gap:.25in;padding:.17in var(--pad) .38in;}
.ft .legal{flex:1;font:300 5.8pt/1.45 var(--body);color:rgba(0,39,58,.62);}
.ft .src{display:block;margin-top:.04in;}
.badges{display:flex;gap:.13in;align-items:center;flex:none;}
.badge{width:.37in;height:.37in;display:block;}
.badge svg,.badge img{width:100%;height:100%;display:block;}

/* SAMPLE DATA stamp — prints. Removed by setting NJ_SAMPLE_DATA = false in transactions.js. */
.stamp{position:absolute;top:1.1in;right:.62in;transform:rotate(-2deg);z-index:5;
  border:2px solid #8C3A2B;color:#8C3A2B;background:rgba(255,255,255,.92);padding:.04in .12in;
  font:800 7.5pt var(--sans);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;pointer-events:none;}
</style>
</head>
<body data-root="../../" data-nav="tools" data-foot="none">
<main>
<h1 class="visually-hidden">NJ Footprint</h1>

<div id="app">
  <main id="stage">
    <div id="pages">
      <div class="pg-col">
        <div class="page-wrap" id="pageWrap">
          <div class="page sheet" id="sheet"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="stageBar">
    <span class="zlab" id="stageNote"></span>
    <div class="sp"></div>
    <button class="btn lg" id="btnPrint" type="button" title="In the print dialog: Save as PDF, Paper Letter, Margins None, and enable Background graphics.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg>
      Print / Save PDF
    </button>
  </div>
</div>
</main>

<script src="../../assets/js/chrome.js"></script>
<script src="../../assets/js/legal.js"></script>
<script src="nj-counties.js"></script>
<script src="transactions.js"></script>
<script src="footprint.js"></script>
<script>
(function () {
  'use strict';
  const F = window.NJFootprint, MAP = window.NJ_COUNTIES, ROWS = window.NJ_TRANSACTIONS;
  const S = F.summarize(ROWS);
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = F.moneyShort;
  const noun = n => n === 1 ? 'sale' : 'sales';
  const years = ROWS.map(r => +r.date.slice(0, 4));
  const yMin = Math.min.apply(null, years), yMax = Math.max.apply(null, years);
  const span = yMin === yMax ? String(yMin) : yMin + '–' + yMax;
  const pct = n => Math.round(100 * n / S.volume) + '%';

  /* ---------- the map ---------- */
  function mapSVG() {
    const room = 150;                                  // right-hand margin for the two callouts
    const body = MAP.counties.map(c => {
      const t = F.tone(c.name, S);
      return '<path class="county ' + t + '" d="' + c.d + '"><title>' + esc(c.name) + ' County</title></path>';
    }).join('');
    const nums = MAP.counties.filter(c => F.tone(c.name, S) === 'active').map(c =>
      '<text class="cnum" x="' + c.c[0] + '" y="' + c.c[1] + '">' + S.byCounty[c.name].deals + '</text>').join('');
    // Callouts run out into the Atlantic, so the two shore counties can be named without
    // cramming text into their outlines.
    const callouts = F.CORE.map(name => {
      const c = MAP.counties.find(k => k.name === name), s = S.byCounty[name];
      return { c, s, y: c.c[1] };
    });
    callouts.sort((a, b) => a.y - b.y);
    if (callouts.length > 1 && callouts[1].y - callouts[0].y < 34) callouts[1].y = callouts[0].y + 34;
    const x0 = MAP.width - 8;
    const lead = callouts.map(k => {
      const lx = x0 + 6;
      return '<circle class="lead-dot" cx="' + k.c.c[0] + '" cy="' + k.c.c[1] + '" r="2"/>' +
        '<path class="lead" d="M' + k.c.c[0] + ' ' + k.c.c[1] + ' L' + (x0 - 12) + ' ' + k.y + ' L' + lx + ' ' + k.y + '"/>' +
        '<text class="lbl-n" x="' + (lx + 4) + '" y="' + (k.y - 3) + '">' + esc(k.c.name.toUpperCase()) + '</text>' +
        '<text class="lbl-v" x="' + (lx + 4) + '" y="' + (k.y + 9) + '">' + k.s.deals + ' ' + noun(k.s.deals) + ' · ' + money(k.s.volume) + '</text>';
    }).join('');
    return '<svg id="mapsvg" viewBox="0 0 ' + (MAP.width + room) + ' ' + MAP.height + '" role="img" aria-label="Map of New Jersey counties where The GVC Team has closed sales" preserveAspectRatio="xMidYMid meet">' +
      body + nums + lead + '</svg>';
  }

  /* ---------- the sheet ---------- */
  function sheet() {
    const core = F.CORE.map(n => {
      const s = S.byCounty[n] || { deals: 0, volume: 0 };
      return '<div class="c"><div class="nm">' + esc(n) + ' County</div>' +
        '<div class="fig"><b>' + s.deals + '</b> ' + noun(s.deals) + ' · <b>' + money(s.volume) + '</b><br>' + pct(s.volume) + ' of our NJ volume</div></div>';
    }).join('');

    const others = Object.keys(S.byCounty).filter(n => F.CORE.indexOf(n) === -1)
      .sort((a, b) => S.byCounty[b].volume - S.byCounty[a].volume);
    const also = others.length ? '<div class="also"><p class="eyebrow">Also active</p><ul>' + others.map(n =>
      '<li><span class="sw"></span><span class="cn">' + esc(n) + '</span><span class="cv">' + S.byCounty[n].deals + ' · ' + money(S.byCounty[n].volume) + '</span></li>').join('') + '</ul></div>' : '';

    const topVol = Math.max.apply(null, F.AGENTS.map(a => S.byAgent[a].volume));
    const team = F.AGENTS.map(a => {
      const s = S.byAgent[a], slug = a.toLowerCase().replace(/ /g, '-');
      return '<div class="ag"><img src="../../assets/agents/' + slug + '.png" alt="" width="40" height="40">' +
        '<div class="who"><div class="an">' + esc(a) + '</div><div class="av"><b>' + money(s.volume) + '</b> · ' + s.deals + ' ' + noun(s.deals) + '</div>' +
        '<div class="bar"><i style="width:' + Math.round(100 * s.volume / topVol) + '%"></i></div></div></div>';
    }).join('');

    /* COPY: the snowbird line is a placeholder until the team supplies its wording. */
    const snow = '<div class="snow"><div class="k">Snowbirds<br>Florida to New Jersey</div>' +
      '<p><b>Wintering in Florida, calling New Jersey home?</b> The same team that works the Jersey shore sells and buys on both ends, so one conversation covers the whole move.</p></div>';

    const badges = ['badge-de.svg', 'badge-gvc.svg'].map(f => '<span class="badge"><img src="../../assets/logos/sheet/' + f + '" alt=""></span>').join('') +
      '<span class="badge"><svg viewBox="8.5 8 23.5 22" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#00273A" stroke-width="1.6"><path d="M20 9.5 10 17h2.3v11.5h15.4V17H30L20 9.5z" stroke-linejoin="round"/><path d="M16 20h8M16 23.6h8" stroke-linecap="round"/></svg></span>';

    return (window.NJ_SAMPLE_DATA ? '<div class="stamp">Sample data — not real sales</div>' : '') +
      '<div class="hd"><img class="lockup" src="../../assets/logos/sheet/lockup-navy.svg" alt="The GVC Team"><div class="meta">New Jersey · closed sales ' + span + '</div></div>' +
      '<div class="title"><h1>Where we <em>work.</em></h1><p>From the Monmouth shore down through Ocean County, and across the rest of New Jersey: where The GVC Team sells, and how much business it has done.</p></div>' +
      '<div class="hero"><div class="stat"><div class="n">' + S.deals + '</div><div class="l">Closed sales in New Jersey</div></div>' +
        '<div class="stat"><div class="n">' + money(S.volume) + '</div><div class="l">Total sales volume</div></div></div>' +
      '<div class="body"><div class="mapcol">' + mapSVG() + '</div>' +
        '<div class="panel"><p class="eyebrow">Our core markets</p><div class="core">' + core + '</div>' + also +
        '</div></div>' +
      '<div class="team"><p class="eyebrow">The team</p>' + team + '</div>' +
      snow +
      '<div class="ft"><div class="legal">' + window.GVC_LEGAL.BROKERAGE + '<span class="src">Figures are closed sales from MLS records, ' + span + '.</span></div><div class="badges">' + badges + '</div></div>';
  }

  $('sheet').innerHTML = sheet();
  $('stageNote').textContent = S.deals + ' sales · ' + money(S.volume) + (window.NJ_SAMPLE_DATA ? ' · sample data' : '');

  /* ---------- fit the sheet to the preview well on screen (print is untouched: builder.css) ---------- */
  function fit() {
    const stage = $('stage'), wrap = $('pageWrap'), pg = $('sheet');
    const w = pg.offsetWidth, h = pg.offsetHeight;
    // Wide screens: the well has a fixed height, so fit both ways. Below 1100px builder.css lets the page
    // grow with its content, so the well's height is just the sheet's own: fit to width only.
    const stacked = window.matchMedia('(max-width:1100px)').matches;
    const s = Math.max(.3, Math.min(1, (stage.clientWidth - 52) / w, stacked ? 1 : (stage.clientHeight - 52) / h));
    pg.style.transform = 'scale(' + s + ')';
    wrap.style.width = w * s + 'px'; wrap.style.height = h * s + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('beforeprint', () => { $('sheet').style.transform = ''; $('pageWrap').style.width = $('pageWrap').style.height = ''; });
  window.addEventListener('afterprint', fit);
  fit();
  $('btnPrint').addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
