<style>
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:10px 0 24px}
.hd > div{min-width:0}
.hd h1{font-size:40px;line-height:1.1;display:flex;gap:14px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.hd .sub{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px;color:var(--ink-soft)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px}
.facts .k{font-family:var(--sans-display);font-weight:800;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-soft)}
.facts .v{font-family:var(--mono);font-size:20px;margin-top:6px;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.facts .s{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start;margin-top:24px}
.two > div{min-width:0}
.one{margin-top:24px}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.log li > div{min-width:0;overflow-wrap:anywhere}
.log li:last-child{border-bottom:0}
.log .dt{width:8px;height:8px;border-radius:50%;background:var(--rule);margin-top:6px}
.log .dt.de{background:var(--cyan)}
.log .dt.m{background:var(--ink)}
.log small{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.log .w{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap}
.logf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.logf #noteText{flex:1 1 200px}
.logf select{flex:0 1 auto;max-width:100%}
.path{font-family:var(--mono);font-size:12px;color:var(--ink-soft);overflow-wrap:anywhere}
.steps-wrap{overflow-x:auto;padding:6px 4px}   /* room for the current step's halo: a scrolling box clips it */
.steps{min-width:640px}
.ck-block{margin-top:14px}
.ck-block h3{font-family:var(--sans-display);font-weight:800;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.ck-block ul{list-style:none;margin:0;padding:0}
.ck-block li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13.5px;color:var(--ink-soft)}
.ck-block li .bx{width:14px;height:14px;border:1.5px solid var(--rule);border-radius:3px;flex-shrink:0;margin-top:2px;display:inline-flex;align-items:center;justify-content:center}
.ck-block li.done{color:var(--ink)}
.ck-block li.done .bx{background:var(--ink);border-color:var(--ink);color:var(--bone)}
.ck-block li .bx svg.i{width:11px;height:11px;stroke-width:2.4}
.ck-block li .w{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap}
.as-st{font-size:13.5px;color:var(--ink-soft);margin-top:4px}
.as-mm{margin-top:14px}
.as-mm h3{font-family:var(--sans-display);font-weight:800;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.hint-b{display:flex;gap:6px}
.hint-b .b{min-width:38px;justify-content:center}
/* facts table (mockup .ft) */
.ft{width:100%;border-collapse:collapse;table-layout:fixed}
.ft th{text-align:left;vertical-align:top;font-family:var(--sans-display);font-weight:800;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);padding:11px 8px 9px 0;border-bottom:1px solid var(--rule);width:36%}
.ft td{padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px;overflow-wrap:anywhere;min-width:0}
.ft .fe{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px;overflow-wrap:anywhere;max-width:100%}
.ft .fe:hover{text-decoration-color:var(--sky)}
.ft .fe:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.fo{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.fw{font-size:12.5px;color:var(--danger);margin-top:3px;display:flex;gap:6px;align-items:center}
.fw svg,.aw-n svg{width:14px;height:14px;flex-shrink:0}
.fed{margin-top:8px}
.fed .inp{width:100%;display:block}
.ftypo{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:8px}
.fbtn{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fmsg{font-size:13px;color:var(--danger);margin-top:6px;min-height:1.2em}
.fmsg:empty{min-height:0;margin:0}
details.fx summary{cursor:pointer;font-weight:600;font-size:13.5px;padding:12px 0 4px}
/* agents */
.agents{list-style:none;margin:0;padding:0}
/* the header's Link buttons: green and "Relink" once linked */
.acts .links{display:contents}
.b.lk.ok{background:#E4F2E8;border-color:#2E7D4F;color:#1E5A36}
.b.lk.ok:hover{background:#D5EBDC}
.b.lk:not(.ok){border-color:var(--danger);color:var(--danger)}
/* Floorplans, Photos and Social posts inside the Marketing track */
#kitCard .mt-sub{margin-top:18px;padding-top:4px;border-top:1px solid var(--rule)}
#kitCard .mt-sub > .card{border:0;background:none;box-shadow:none;padding:12px 0 0;margin:0}
#postsCard .ph3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:12px 0 4px;font-weight:600}
#postsCard .posts{list-style:none;margin:0;padding:0;font-size:13.5px}
#postsCard .posts li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--rule)}
#postsCard .posts li:last-child{border-bottom:0}
#postsCard .pd{flex:none;width:52px;color:var(--ink-soft);font-family:var(--mono);font-size:11.5px}
#postsCard .pn{flex:1;min-width:0;overflow-wrap:anywhere}
.agent{display:flex;align-items:center;gap:12px;padding:8px 0}
.agent .ph{width:40px;height:40px;border-radius:50%;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);object-fit:cover;flex-shrink:0}
.agent .aw{flex:1;min-width:0;overflow-wrap:anywhere}
.agent .an{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.agent .at{font-size:13px;color:var(--ink-soft)}
.agent .ab{display:flex;gap:4px}
.asug{font-size:14.5px}
.as{font-size:12.5px;margin-top:4px}
.aw-n{font-size:13px;color:var(--danger);margin-top:8px;display:flex;gap:6px;align-items:flex-start}
.awhy{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;color:var(--ink-soft)}
.apick{margin-top:12px}
.apick .inp{width:100%}
.aopts{list-style:none;margin:8px 0 0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.apick button.link{background:none;border:0;padding:0;margin-top:8px;cursor:pointer}
/* development ticks */
.mr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mtick{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mtick .inp{width:auto}
/* the Pieces card sits under the facts, above the Stages */
#piecesCard{margin-top:24px}
/* Drive cards (mockup .kr, .fpm, .phg, .hl) */
.kit{display:flex;flex-direction:column;gap:10px}
.kr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.kr > div{min-width:0;overflow-wrap:anywhere}
.kr .ic{width:44px;height:44px;border-radius:6px;background:var(--paper-2);display:flex;align-items:center;justify-content:center}
.kr .ic svg{width:20px;height:20px}
.kr.stale{border-color:var(--danger)}
.kr.none{background:transparent;border-style:dashed}
.kr .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:15px}
.kr .d{font-size:13px;color:var(--ink-soft);margin-top:3px}
.kr .kmm{color:var(--danger)}
.kr .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.code{font-family:var(--mono);font-size:11px}
.fpm{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:10px;align-items:center}
.fpm .h{font-family:var(--sans-display);font-weight:800;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-soft)}
.fpm .ver{font-family:var(--serif);font-size:17px;overflow-wrap:anywhere;min-width:0}
.fpm .ver small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
.fpm .old{opacity:.6}
.th{min-width:0;overflow-wrap:anywhere;font-size:12.5px;color:var(--ink)}
.th .tg{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
.th .tn{display:block;font-size:12px}
.th.empty{color:var(--ink-soft)}
.fpalt{font-size:13px;margin-top:10px;overflow-wrap:anywhere}
.fpform{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.fpform #fpNote{flex:1 1 220px}
.fpform select{max-width:100%}
.fpform .fbtn,.fpform .fmsg{flex-basis:100%}
.phs{margin-bottom:12px}
.phraw{font-size:13.5px;padding:6px 13px;color:var(--ink-soft)}
.phg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.phg .pair{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.pt{display:flex;flex-direction:column;gap:5px;min-width:0}
.pt .pi{aspect-ratio:3/2;border-radius:5px;background:var(--paper-2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--ink-soft);padding:4px;text-align:center}
.pt .pi img{width:100%;height:100%;object-fit:cover}
.pt .pi.pfail{color:var(--danger)}
.pt.hero .pi{outline:2px solid var(--ink);outline-offset:1px}
.pt .pn{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);overflow-wrap:anywhere}
.pt .pb{display:flex;gap:4px;flex-wrap:wrap}
#phPicks{margin-top:14px}
.phh{font-size:14px;margin-bottom:6px}
.picks{margin:0 0 6px;padding-left:22px;font-size:13.5px}
.picks li{padding:4px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.picks .pn{overflow-wrap:anywhere;min-width:0}
.picks .pa{display:flex;gap:4px;margin-left:auto}
.hl{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper-2);border-radius:6px;padding:10px 12px;margin-top:8px;font-size:14px}
.hl .x{display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}
.hl .x svg{width:16px;height:16px;flex-shrink:0}
.hl .k{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap}
.hl.warn .x svg{color:var(--danger)}
.tree{margin-top:10px}
.trd summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;padding:6px 0;font-size:14px;border-bottom:1px solid var(--rule)}
.trd summary .x{overflow-wrap:anywhere;min-width:0}
.trd summary .k{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap}
.tri{padding-left:14px}
.trf{list-style:none;margin:0;padding:2px 0 6px}
.trf li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0}
.trf li span:first-child{overflow-wrap:anywhere;min-width:0}
.trf .k{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap}
.troff{font-size:13px;color:var(--ink-soft);opacity:.7;margin-top:8px}
.docl{font-size:14px;overflow-wrap:anywhere}
#docNow{font-size:13px;margin-top:6px;overflow-wrap:anywhere}
@media (max-width:640px){ .fpm{grid-template-columns:64px repeat(3,minmax(0,1fr))} .kr{grid-template-columns:minmax(0,1fr)} .kr .ic{display:none} .kr .a{justify-content:flex-start} }
@media (max-width:1100px){ .two{grid-template-columns:minmax(0,1fr)} }
/* Slice 4: the showsheet's record on the Kit row; making and rebuilding need the desktop (S20) */
#rebuildHost{display:contents}
.kr button.link{background:none;border:0;padding:0;cursor:pointer}
/* a phone hides the ways into a piece's own page; the helper's one-click buttons stay: any device may ask (0017) */
@media (max-width:600px){ a#rebuildStale, a[data-piece]{display:none} }
@media (max-width:720px){ .hd h1{font-size:30px} }
/* phone: the stages wrap into rows of three so every one stays in view (no hidden scroll) */
@media (max-width:640px){ .steps{min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));row-gap:18px} .step::before{display:none} }
</style>

     The details doc is read with the Showsheet's own reader (same pinned mammoth as tools/showsheet). -->
<script async id="mammothJs" src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js" integrity="sha384-/cXAMbzovUIKbBERjPmR3SnPTh8siWr5lsvFYj1Uq4XP0yaJUZJmsh0YXyGv5P0y" crossorigin="anonymous" onerror="this.dataset.failed='1'"></script>

<script>
(function () {
  'use strict';
  var P = window.GVC_PROPS, W = window.GVC_WS, F = window.GVC_FACTS, JP = window.GVC_JP, I = window.GVC_ICON, esc = window.GVC_ESC, $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var kind = q.has('listing') ? 'listing' : q.has('pitch') ? 'pitch' : q.has('dev') ? 'dev' : null;
  var slug = kind ? q.get(kind) : '';
  var TABLE = { listing: 'properties', pitch: 'pitches', dev: 'dev_projects' }[kind];
  var OWNER = { listing: 'property_id', pitch: 'pitch_id', dev: 'dev_project_id' }[kind];
  var today = W.today();
  var state = { row: null, job: null, changes: [], won: null, me: null, drive: null, doc: null, budget: null };
  var shell = GVC_SHELL.mount({ onDrive: function (s) { var was = state.drive; state.drive = s; if (state.row && s !== was) render(); } });

  function rest(path) { return P.call('/rest/v1' + path); }
  function page(html) { $('page').innerHTML = html; }
  function missing() {
    page('<div class="card empty" style="margin-top:20px"><b>No job called "' + esc(slug || '(none)') + '"</b>It may have been renamed or never existed. <a class="link" href="../">Back to the overview</a></div>');
  }

  /* who may edit (D87): the owner account; anyone else on the team may add a note */
  function who() {
    return P.whoAmI().then(function (me) { return me || { role: null }; }, function () { return { role: null }; });
  }

  function load() {
    if (!TABLE || !slug) return Promise.resolve(missing());
    return rest('/' + TABLE + '?slug=eq.' + encodeURIComponent(slug) + '&select=*').then(function (rows) {
      var row = rows && rows[0];
      if (!row) return missing();
      return Promise.all([
        rest('/changes?' + OWNER + '=eq.' + encodeURIComponent(row.id) + '&select=*&order=at.desc&limit=500'),
        kind === 'listing' ? rest('/pitches?won_property_id=eq.' + encodeURIComponent(row.id) + '&select=*') : Promise.resolve([]),
        kind === 'pitch' && row.won_property_id ? rest('/properties?id=eq.' + encodeURIComponent(row.won_property_id) + '&select=slug,label,core') : Promise.resolve([]),
        who(),
        // the pieces' records (Slice 4, 5); unreadable (0009 or 0010 not run yet) means none, never a broken page
        kind === 'listing' || kind === 'pitch' ? rest('/documents?' + OWNER + '=eq.' + encodeURIComponent(row.id) + '&select=tool,version,built_from,built_at,output')
          .catch(function () { return []; }) : Promise.resolve([]),
        // its social posts from Asana (0012); unreadable means none
        kind === 'listing' || kind === 'dev' ? rest('/asana_tasks?' + (kind === 'dev' ? 'dev_project_id' : 'property_id') + '=eq.' + encodeURIComponent(row.id) +
          '&kind=eq.post&select=gid,name,due_on,completed_at,fields').catch(function () { return []; }) : Promise.resolve([]),
        // its budget (0015): owner, admin and the helper only, so anyone else reads none
        kind === 'dev' ? rest('/dev_budgets?dev_project_id=eq.' + encodeURIComponent(row.id) + '&select=*').catch(function () { return []; }) : Promise.resolve([]),
        // the pieces asked of the helper (0017); unreadable (0017 not run yet) means none
        kind === 'listing' || kind === 'pitch' ? requestsOf(row) : Promise.resolve([])
      ]).then(function (r) {
        state.row = row;
        state.changes = (r[0] || []).slice().sort(function (a, b) { return a.at > b.at ? -1 : a.at < b.at ? 1 : 0; });
        state.me = r[3];
        state.docs = r[4] || [];
        state.posts = r[5] || [];
        state.budget = (r[6] || [])[0] || null;
        state.doc = state.docs.filter(function (d) { return d && d.tool === 'showsheet'; })[0] || null;
        state.requests = r[7] || [];
        JP.canEdit = state.me.role === 'owner';
        JP.canAsk = ASKERS.indexOf(state.me.role) !== -1;
        var data = { properties: [], pitches: [], devProjects: [], changes: state.changes };
        if (kind === 'listing') { data.properties = [row]; data.pitches = r[1] || []; }
        if (kind === 'pitch') data.pitches = [Object.assign({}, row, { won_property_id: null })];   // show the pitch itself even when won
        if (kind === 'dev') data.devProjects = [row];
        state.job = W.buildJobs(data, today, { archived: true })[0];
        state.won = (r[2] || [])[0] || null;
        if (!state.job) return missing();   // a listing with no stage yet
        render();
        follow();
      }).catch(function (e) {
        page('<div class="card empty" style="margin-top:20px"><b>The job couldn\'t load</b>' + esc(e.message) + '</div>');
      });
    }, function (e) {
      page('<div class="card empty" style="margin-top:20px"><b>The job couldn\'t load</b>' + esc(e.message) + '</div>');
    });
  }
  JP.reload = load;
  JP.redraw = function () { if (state.row) render(); };

  function ctx() {
    return { kind: kind, table: TABLE, row: state.row, job: state.job, changes: state.changes, me: state.me, canEdit: JP.canEdit, canAsk: JP.canAsk, drive: state.drive, W: W, I: I, esc: esc,
      doc: state.doc, docs: state.docs, posts: state.posts, budget: state.budget, requests: state.requests, onSheet: paintRebuild };
  }

  /* ---------- 0017: the helper makes the pieces (overturns D89, D91) ----------
     Make / Rebuild on a piece, and Rebuild n stale, add piece requests; the helper on Matt's desktop
     makes them (at once when it runs on this computer, else when it next runs). Asking again for a
     piece already waiting joins that request. The page follows the requests and reloads once the
     helper has finished one, so the row shows the file it made. */
  var ASKERS = ['owner', 'admin', 'marketing', 'shared'];
  function requestsOf(row) {
    return rest('/piece_requests?' + OWNER + '=eq.' + encodeURIComponent(row.id) + '&select=*&order=asked_at.desc&limit=40').catch(function () { return []; });
  }
  function ask(tools) {
    var r = state.row;
    return tools.reduce(function (done, tool) {
      return done.then(function (n) {
        var body = { tool: tool };
        body[OWNER] = r.id;
        return P.call('/rest/v1/piece_requests', { method: 'POST', body: JSON.stringify(body), prefer: 'return=minimal' })
          .then(function () { return n + 1; }, function (e) { if (e && e.status === 409) return n; throw e; });   // 409: already waiting
      });
    }, Promise.resolve(0)).then(function () {
      // on the desktop that runs the helper it starts now; nothing to do anywhere else
      return GVC_SHELL.helper('POST', '/pieces/run', {}).then(function (x) { return !!(x && x.ok); }, function () { return false; });
    }).then(function (here) {
      return requestsOf(r).then(function (rows) {
        state.requests = rows || [];
        render();
        $('actMsg').textContent = here ? 'The helper is making ' + (tools.length > 1 ? 'them' : 'it') + '.'
          : 'Asked. The helper makes ' + (tools.length > 1 ? 'them' : 'it') + ' on Matt\'s desktop; this page shows when ' + (tools.length > 1 ? 'they are' : 'it is') + ' done.';
        follow();
      });
    }, function (e) {
      $('actMsg').textContent = e && (e.status === 401 || e.status === 403) ? 'This account can\'t ask the helper to make pieces.' : (e && e.message) || 'The request didn\'t go through.';
      // the button was greyed while asking: let the person try again
      document.querySelectorAll('[data-build], button#rebuildStale').forEach(function (x) { x.disabled = false; });
    });
  }
  var following = null;
  function follow() {
    var open = function () { return (state.requests || []).some(function (q) { return q.status === 'waiting' || q.status === 'working'; }); };
    if (following || !state.row || !open()) return;
    following = setInterval(function () {
      if (!state.row) { clearInterval(following); following = null; return; }
      requestsOf(state.row).then(function (rows) {
        var before = JSON.stringify((state.requests || []).map(function (q) { return [q.id, q.status]; }));
        state.requests = rows || [];
        var after = JSON.stringify(state.requests.map(function (q) { return [q.id, q.status]; }));
        if (open()) { if (before !== after) render(); return; }
        clearInterval(following); following = null;
        load();   // one finished: its record is new
      });
    }, window.__jobPollMs || 5000);
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-build], button#rebuildStale');
    if (!b || b.disabled || !JP.canAsk || !state.row) return;
    var tools = b.id === 'rebuildStale' ? String(b.dataset.tools || '').split(',').filter(Boolean) : [b.dataset.build];
    if (!tools.length) return;
    b.disabled = true;
    $('actMsg').textContent = 'Asking the helper…';
    ask(tools);
  });

  /* S21: Rebuild n stale in the header, from the scan at first, then live. Slice 5: every piece of the
     job counts (JP.kit.judgeAll: [{ tool, s, href }]). 0017: one click asks the helper for every stale
     piece it makes (anyone who may ask); a stale map alone still opens Map Studio (the owner). */
  function paintRebuild(list) {
    var host = $('rebuildHost');
    if (!host) return;
    var stale = (Array.isArray(list) ? list : []).filter(function (x) { return x && x.s && x.s.state === 'stale'; });
    var K = JP.kit, c = ctx();
    var made = stale.filter(function (x) { return K.HELPER_MAKES.indexOf(x.tool) !== -1 && !K.openRequest(c, x.tool); });
    if (JP.canAsk && made.length && state.row.drive_folder) {
      host.innerHTML = '<button class="b primary" type="button" id="rebuildStale" data-tools="' + esc(made.map(function (x) { return x.tool; }).join(',')) + '">Rebuild ' + made.length + ' stale</button>';
      return;
    }
    var byHand = stale.filter(function (x) { return K.HELPER_MAKES.indexOf(x.tool) === -1; });
    host.innerHTML = byHand.length && JP.canEdit ? '<a class="b primary" id="rebuildStale" href="' + esc(byHand[0].href) + '">Rebuild ' + byHand.length + ' stale</a>' : '';
  }

  function tile(k, v, s, badge) {
    return '<div><div class="k">' + esc(k) + '</div><div class="v">' + (v ? esc(v) : '<span class="soft">Not set</span>') + (badge ? ' <span class="chip de">' + esc(badge) + '</span>' : '') + '</div>' +
      (s ? '<div class="s">' + esc(s) + '</div>' : '') + '</div>';
  }

  /* the tiles across the top: what the job shows (facts card below), else DE's own */
  function tiles() {
    var r = state.row, j = state.job;
    if (kind === 'dev') return '';   // a development's figures are the build overview (build.js)
    if (kind === 'pitch') {
      return '<div class="card"><div class="card-h"><div><h2>Pitch</h2></div>' +
        (j.asanaUrl ? '<a class="b sm" href="' + esc(j.asanaUrl) + '" target="_blank" rel="noopener">' + I('arrow') + 'Open in Asana</a>' : '') + '</div><div class="facts">' +
        tile('Pitched', r.pitched_on ? W.fmtDay(r.pitched_on) + ' ' + r.pitched_on.slice(0, 4) : '') +
        tile('Outcome', r.outcome === 'won' ? 'Won' : r.outcome === 'not won' ? 'Not won' : 'Open') + tile('Market', r.market) + '</div>' +
        (state.won ? '<p style="margin-top:16px">Became the listing <a class="link" href="?listing=' + encodeURIComponent(state.won.slug) + '">' + esc(state.won.label) + '</a>.</p>' : '') + '</div>';
    }
    var de = r.de || {}, by = {};
    F.shown(r.core || {}, r).forEach(function (f) { by[f.name] = f; });
    var pick = function (name) {
      var f = by[name];
      if (f && f.value !== null && f.value !== undefined && f.value !== '') return { v: f.value, badge: f.badge, warn: f.warn };
      return de[name] != null && !F.deBlank(name, de[name]) ? { v: de[name], badge: 'DE' } : { v: null };   // DE's 0 sq ft / baths: not known (M4)
    };
    var money = r.kind === 'rental' ? pick('rent').v != null ? pick('rent') : pick('price') : pick('price');
    var beds = pick('beds'), baths = pick('baths'), half = pick('halfBaths'), sqft = pick('sqft');
    var warn = money.warn ? money.warn.source + ' says ' + W.money(money.warn.value) : '';
    return '<div class="card"><div class="facts">' +
      tile(r.kind === 'rental' ? 'Rent' : 'Price', money.v != null ? W.money(money.v) + (r.kind === 'rental' ? '/mo' : '') : '', warn, money.badge) +
      tile('Beds · baths', [beds.v != null ? beds.v + ' bd' : '', baths.v != null ? baths.v + ' ba' : ''].filter(Boolean).join(' · '), half.v ? half.v + ' half' : '', beds.badge || baths.badge) +
      tile('Sq ft', sqft.v != null ? Number(sqft.v).toLocaleString('en-US') + ' approx.' : '', '', sqft.badge) +
      tile('DE status', W.deLabel(j.deStatus), r.de_listing_id ? 'DE id ' + r.de_listing_id : 'not matched to DE yet') +
      ((r.core || {}).neighborhood || !(r.core || {}).city ? tile('Neighborhood', (r.core || {}).neighborhood || '') : tile('City', r.core.city)) +
      '</div></div>';
  }

  /* the read-only Asana card on a listing (Slice 2, spec §7) */
  var BLOCK = { prep: 'Prep', 'price change': 'Price change', contract: 'Contract', 'post-closing': 'Post-closing' };
  function asanaCard() {
    var r = state.row, j = state.job, a = r.asana;
    var head = '<div class="card-h"><div><h2>Asana</h2></div>' +
      (j.asanaUrl ? '<a class="b sm" href="' + esc(j.asanaUrl) + '" target="_blank" rel="noopener">Open in Asana</a>' : '') + '</div>';
    if (!a && !r.asana_gid) return '<div class="card" id="asanaCard">' + head + '<p class="soft">Not linked to an Asana task yet.</p></div>';
    a = a || {};
    var stage = a.stageFromStatus || a.stageFromSection || r.stage;
    var st = [];
    if (a.status) st.push('Listing Status: ' + a.status);
    if (a.section) st.push('Section: ' + a.section);
    var dates = (j.dates || []).length ? '<div class="dates">' + j.dates.map(function (d) {
      return '<span class="dmk' + (d.planned ? ' planned' : '') + '" title="' + (d.planned ? 'Planned' : 'Done') + '">' + esc(d.label + ' ' + W.fmtDay(d.on)) + '</span>';
    }).join('') + '</div>' : '<p class="soft" style="font-size:13px;margin-top:8px">No deal dates in Asana yet.</p>';
    var ck = (a.checklist || []).map(function (b) {
      return '<div class="ck-block"><h3>' + esc(BLOCK[b.block] || b.block) + '</h3><ul>' + (b.steps || []).map(function (x) {
        return '<li class="' + (x.done ? 'done' : '') + '"><span class="bx">' + (x.done ? I('check') : '') + '</span>' + esc(x.name) + (x.doneOn ? '<span class="w">' + esc(W.fmtDay(x.doneOn)) + '</span>' : '') + '</li>';
      }).join('') + '</ul></div>';
    }).join('');
    var mm = j.match.length ? '<div class="as-mm"><h3>Mismatches</h3><ul class="mm">' + j.match.map(function (m) {
      return '<li><span class="code">' + esc(m.code) + '</span><span>' + esc(m.text) + '</span></li>';
    }).join('') + '</ul><p style="margin-top:8px"><a class="link" href="../match/">See every error</a></p></div>' : '';
    return '<div class="card" id="asanaCard">' + head +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="chip ' + esc(W.chipOf(stage)) + '">' + esc(stage) + '</span>' + (a.gone ? '<span class="chip stale">Asana task gone</span>' : '') + '</div>' +
      (st.length ? '<div class="as-st">' + esc(st.join(' · ')) + '</div>' : '') + dates + mm +
      (ck || '<p class="soft" style="font-size:13px;margin-top:12px">No checklist read yet.</p>') + '</div>';
  }

  function steps() {
    var j = state.job;
    if (kind === 'dev') return '';
    return '<div class="card" data-collapse="off" style="margin-top:24px"><div class="card-h"><div><h2>Stages</h2></div></div><div class="steps-wrap"><div class="steps">' +
      j.steps.map(function (s, i) {
        var cls = i === j.stageIdx ? 'cur' : (j.done[s] || (s === 'Pitch' && j.pitchedOn)) ? 'done' : i < j.stageIdx ? 'skip' : '';
        var d = s === 'Pitch' ? (j.pitchedOn || j.done.Pitch) : j.done[s];
        return '<div class="step ' + cls + '"><span class="dot">' + (cls === 'done' ? I('check') : (i + 1)) + '</span>' + esc(s) + '<span class="d">' + (d ? esc(W.fmtDay(d)) : '') + '</span></div>';
      }).join('') + '</div></div></div>';
  }

  /* S13: the folder's Drive link, from the helper, else last night's scan, else the G: path (GVC_JP.drive) */
  function gPath() { return JP.drive.gPath(state.row); }

  function render() {
    var r = state.row, j = state.job, c = ctx();
    document.title = j.name + ' · GVC Workspace';
    $('crumb').innerHTML = (kind === 'dev' ? '<a href="../new-dev/">New Dev</a>' : '<a href="../jobs/">Resell</a>') + '<span>/</span><span>' + esc({ listing: j.type === 'rental' ? 'Rentals' : 'Listings', pitch: 'Pitches', dev: 'Developments' }[kind]) + '</span><span>/</span><span>' + esc(j.name) + '</span>';
    var sub = ['<span class="chip">' + esc(j.market || '?') + '</span>'];
    if (j.place) sub.push(esc(j.place));
    if (j.pitchedOn && kind !== 'pitch') sub.push('Pitched ' + esc(W.fmtDay(j.pitchedOn)));
    // red "Link …" until linked, green "Relink …" once linked; a folder that moved is red "Relink"
    var linkBtn = function (id, what, ok, again) {
      return '<button class="b lk' + (ok ? ' ok' : '') + '" type="button" id="' + id + '">' + (ok ? I('check') : I('link')) + (ok || again ? 'Relink ' : 'Link ') + esc(what) + '</button>';
    };
    var links = JP.canEdit ? '<div class="links">' + linkBtn('link', 'Google Drive', r.folder_state === 'linked', r.folder_state === 'broken') +
      (kind === 'listing' ? linkBtn('linkAsana', 'Asana', !!r.asana_gid && !(r.asana && r.asana.gone)) + linkBtn('linkDe', 'DE', !!r.de_listing_id) : '') + '</div>' : '';
    var acts = '<div class="acts"><span id="rebuildHost"></span>' + links +
      '<button class="b" type="button" id="open"' + (r.drive_folder && r.folder_state === 'linked' ? '' : ' disabled') + '>' + I('folder') + 'Open folder</button>' +
      (j.listingUrl && /^https:\/\//.test(j.listingUrl) ? '<a class="b" href="' + esc(j.listingUrl) + '" target="_blank" rel="noopener">' + I('arrow') + 'DE listing</a>' : '') +
      (j.asanaUrl ? '<a class="b" id="asanaLink" href="' + esc(j.asanaUrl) + '" target="_blank" rel="noopener">' + I('arrow') + 'Open in Asana</a>' : '') +
      (kind === 'dev' && state.budget ? '<a class="b" href="https://docs.google.com/spreadsheets/d/' + esc(state.budget.sheet_id) + '/edit" target="_blank" rel="noopener">' + I('arrow') + 'Budget sheet</a>' : '') +
      // archive a listing (its stage) or a development (0018), the owner only; a click asks "Confirm?" first
      (JP.canEdit && kind !== 'pitch' ? '<button class="b" type="button" id="archive">' + archiveLabel(false) + '</button>' : '') + '</div>';
    var right = [], left = [];
    if (kind === 'listing') left.push('<div id="kitHost">' + JP.kit.html(c, '<div class="mt-sub" id="fpHost">' + JP.floorplans.html(c) + '</div>' +
      '<div class="mt-sub" id="photosHost">' + JP.photos.html(c) + '</div>' + '<div class="mt-sub" id="postsHost">' + JP.posts.html(c) + '</div>') + '</div>', '<div id="factsHost">' + JP.facts.html(c) + '</div>');
    if (kind === 'dev') left.push('<div id="msHost">' + JP.dev.html(c) + '</div>');
    (kind === 'dev' ? right : left).push((kind === 'dev' ? JP.posts.html(c) : '') + '<div id="logHost">' + JP.log.html(c) + '</div>');
    if (kind !== 'dev') right.push('<div id="agentsHost">' + JP.agents.html(c) + '</div>');
    if (kind === 'listing') right.push('<div id="docHost">' + JP.doc.html(c) + '</div>');
    if (kind !== 'dev') right.push('<div id="folderHost">' + JP.folder.html(c) + '</div>');
    if (kind === 'listing') right.push(asanaCard());
    // a development shows the phase its build is in (Asana's schedule), else its milestone stage
    var phase = kind === 'dev' && window.GVC_DEVBUILD.currentPhase(r.schedule);
    var stage = isArchived() ? '<span class="chip">Archived</span>' : phase ? '<span class="chip">' + esc((phase.section ? window.GVC_DEVBUILD.sectionLabel(phase.section) + ': ' : '') + phase.name) + '</span>' : '<span class="chip ' + j.chip + '">' + esc(j.stage) + '</span>';
    page('<div class="hd"><div><h1>' + esc(j.name) + ' ' + stage + '</h1><div class="sub">' + sub.join(' · ') + '</div>' + (JP.canEdit ? '' : '<div class="pj-sync">' + window.GVC_SYNCB(j.sync) + '</div>') +
      // the folder's path itself isn't shown (Open folder and the Drive links reach it); only a problem with it is
      (!r.drive_folder ? '<div class="path" style="margin-top:8px">No Drive folder linked yet</div>' : r.folder_state === 'broken' ? '<div class="path" style="margin-top:8px"><span class="chip stale">Drive folder moved or renamed</span></div>' : '') +
      '<p class="soft" id="actMsg" role="status" style="font-size:13px;margin-top:6px"></p></div>' + acts + '</div>' +
      '<div id="topHost">' + tiles() + '</div>' +
      // the pieces made from the job sit near the top, under the facts (Slice 5, S16)
      (kind === 'listing' || kind === 'pitch' ? '<div id="piecesHost">' + JP.kit.piecesHtml(c, (r.scan && r.scan.pieces) || {}, false) + '</div>' : '') +
      (kind === 'dev' ? '<div id="buildHost">' + JP.build.html(c) + '</div>' : '') + steps() +
      '<div class="' + (right.length ? 'two' : 'one') + '"><div class="stack">' + left.join('') + '</div><div class="stack">' + right.join('') + '</div></div>');
    if (kind === 'listing' || kind === 'pitch') paintRebuild(JP.kit.judgeAll(c, (r.scan && r.scan.pieces) || {}, false));
    if ($('piecesHost')) JP.kit.wirePieces(c);
    if (kind === 'dev') { JP.dev.wire($('msHost'), c); JP.build.wire($('buildHost'), c); }
    if ($('factsHost')) JP.facts.wire($('factsHost'), c);
    if ($('agentsHost')) JP.agents.wire($('agentsHost'), c);
    JP.log.wire($('logHost'), c);
    // the Drive cards: each reads on its own and fails on its own, never blocking the rest
    [['kitHost', 'kit'], ['fpHost', 'floorplans'], ['photosHost', 'photos'], ['docHost', 'doc'], ['folderHost', 'folder']].forEach(function (x) {
      if ($(x[0])) JP[x[1]].wire($(x[0]), c);
    });

    $('open').addEventListener('click', function () {
      GVC_SHELL.helper('POST', '/open-folder', { folder: r.drive_folder }).then(function (x) { $('actMsg').textContent = x.ok ? 'Opened in File Explorer.' : (x.error || 'Couldn\'t open it.'); },
        function (e) { $('actMsg').textContent = e.message; });
    });
    ['linkAsana', 'linkDe'].forEach(function (b) {
      if ($(b)) $(b).addEventListener('click', function () {
        window.GVC_MATCH_LINK.openForJob({ row: r, type: b === 'linkDe' ? 'de' : 'asana', name: j.name }).then(function (ok) { if (ok) load(); },
          function (e) { $('actMsg').textContent = e.message; });
      });
    });
    if ($('link')) $('link').addEventListener('click', function () {
      GVC_LINK.open({ table: TABLE, row: r, job: j }).then(function (ok) { if (ok) load(); });
    });
    if ($('archive')) $('archive').addEventListener('click', function () {
      var btn = this, was = isArchived(), set, chg;
      // the first click asks; a second within 5 seconds does it
      if (!btn.dataset.armed) {
        btn.dataset.armed = '1';
        btn.innerHTML = archiveLabel(true);
        $('actMsg').textContent = was ? 'Click again to put ' + j.name + ' back on the overview and the lists.'
          : 'Click again to archive ' + j.name + '. It leaves the overview, the lists and the error count; tick "Show archived" on the overview to see it again.';
        setTimeout(function () {
          if (!btn.dataset.armed || btn.disabled) return;
          delete btn.dataset.armed; btn.innerHTML = archiveLabel(false); $('actMsg').textContent = '';
        }, 5000);
        return;
      }
      if (kind === 'dev') {
        set = { archived: !was };
        chg = [{ field: 'archived', old_value: was, new_value: !was }];
      } else {
        // back from Archived goes to Asana's own stage (save_job allows only that), else Prep
        var a = r.asana || {}, to = was ? (a.stageFromStatus || a.stageFromSection || 'Prep') : 'Archived';
        set = { stage: to };
        chg = [{ field: 'stage', old_value: r.stage, new_value: to }];
      }
      btn.disabled = true;
      JP.save(TABLE, r, set, chg).then(function () { load(); },
        function (e) { $('actMsg').textContent = e.message; delete btn.dataset.armed; btn.innerHTML = archiveLabel(false); btn.disabled = false; });
    });
  }

  function isArchived() { var r = state.row || {}; return kind === 'dev' ? !!r.archived_at : r.stage === 'Archived'; }
  function archiveLabel(asking) {
    var was = isArchived();
    return I(was ? 'restore' : 'archive') + (asking ? (was ? 'Confirm restore?' : 'Confirm archive?') : (was ? 'Restore' : 'Archive'));
  }

  if (P.signedIn()) load();
  else {
    page('<div class="card empty" style="margin-top:20px"><b>Sign in</b>This page is for the GVC team.<div style="margin-top:14px"><button class="b primary" type="button" id="gateBtn">Sign in</button></div></div>');
    $('gateBtn').addEventListener('click', function () { P.askSignIn('Sign in to open the workspace.').then(function (ok) { if (ok) { shell.paintMe(); load(); } }); });
  }
})();
</script>
</body>
</html>
