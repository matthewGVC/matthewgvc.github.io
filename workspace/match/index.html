<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match · GVC Workspace</title>
<meta name="description" content="Every place Asana, DE and Drive disagree about a GVC job, grouped by where to fix it and by person.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../assets/logos/monogram.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/logos/monogram-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/logos/apple-touch-icon-180.png">
<!-- Self-hosted STATIC fonts. See assets/css/fonts.css. -->
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/workspace.css">
<style>
#groups > * + *{margin-top:20px}
.who + .who{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.who h3{font-size:19px;margin-bottom:4px}
.mline > div{min-width:0;overflow-wrap:anywhere}
.mline .job{font-weight:600;text-decoration:underline;text-decoration-color:var(--sky);text-underline-offset:3px}
.mline .meta{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12.5px;color:var(--ink-soft)}
.mline .meta .when{font-family:var(--mono);font-size:11px}
.mline .paste{font-family:var(--mono);font-size:11.5px;background:var(--paper-2);border-radius:4px;padding:2px 6px;overflow-wrap:anywhere;color:var(--ink)}
.mline .dz{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mline .dz[hidden]{display:none}
.mline .dz .inp{flex:1;min-width:0}
.mline .msg{font-size:13px;color:var(--danger);margin-top:4px}
.mline .msg:empty{display:none}
.bulk{display:flex;gap:12px;align-items:flex-start}
.bulk > div{min-width:0;flex:1}
.bulk > .code{font-family:var(--mono);font-size:10.5px;color:var(--danger);border:1px solid var(--danger);border-radius:999px;padding:1px 7px;margin-top:2px}
.bulk > div > b{font-size:14px;font-weight:600}
.bulk .bulk-list{margin-top:10px}
.bulk .bulk-list[hidden]{display:none}
/* who is dealing with it (0011): claimed, fixed and waiting for a sync, or still wrong */
.mline .claim{font-family:var(--mono);font-size:11px;border-radius:999px;padding:1px 8px;background:var(--paper-2);color:var(--ink)}
.mline .claim.still{background:none;border:1px solid var(--danger);color:var(--danger)}
.mline.waiting{opacity:.62}
.mline .lnk.do{font-weight:600}
.mline .lnk,.bulk .lnk{background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--sky);text-underline-offset:3px}
</style>
</head>
<body data-nav="match" data-root="../">
<main class="wrap">
  <div class="page-h">
    <div>
      <h1>Errors</h1>
      <p id="lead">Loading the mismatches…</p>
    </div>
  </div>
  <div id="gate" hidden></div>
  <div id="board" hidden><div id="groups"></div>
    <details class="card" id="key" style="margin-top:20px;padding:16px 20px"><summary style="cursor:pointer;font-weight:600">What the codes mean</summary><ul id="keyList" style="margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px"></ul></details>
  </div>
</main>
<script src="../../assets/js/supabase-config.js"></script>
<script src="../../assets/js/property-library.js"></script>
<script src="../../assets/js/roster.js"></script>
<script src="../../assets/js/asana-map.js"></script>
<script src="../../assets/js/job-facts.js"></script>
<script src="../../assets/js/kit-track.js"></script>
<script src="../../assets/js/match-check.js"></script>
<script src="../../assets/js/drive-rules.js"></script>
<script src="../../assets/js/drive.js"></script>
<script src="../../assets/js/address-aliases.js"></script>
<script src="../../assets/js/workspace-data.js"></script>
<script src="../../assets/js/match-link.js"></script>
<script src="../../assets/js/workspace-shell.js"></script>
<script defer src="../../assets/js/ws-collapse.js"></script>
<script>
(function () {
  'use strict';
  var P = window.GVC_PROPS, W = window.GVC_WS, M = window.GVC_MATCH, L = window.GVC_MATCH_LINK, I = window.GVC_ICON, esc = window.GVC_ESC, $ = function (id) { return document.getElementById(id); };
  // the key: every code in plain words (fixed text from match-check.js, still escaped)
  var KEY = (M && M.KEY) || {};
  $('keyList').innerHTML = Object.keys(KEY).map(function (c) { return '<li style="display:grid;grid-template-columns:52px 1fr;gap:10px"><span class="code" style="justify-self:start">' + esc(c) + '</span><span>' + esc(KEY[c]) + '</span></li>'; }).join('');
  var today = W.today(), data = null;
  var shell = GVC_SHELL.mount({ noDrive: true, onSynced: function () { load(); } });
  var WHERE = {
    Asana: 'Fix in Asana.', DE: 'Fix on DE.', Drive: 'Fix on Drive.',
    Matt: 'Fix in the workspace.',
    Roster: 'Update the roster by hand.'
  };
  var OWNER = { properties: 'property_id', dev_projects: 'dev_project_id', pitches: 'pitch_id' };

  function rest(path) { return P.call('/rest/v1' + path); }
  function gate(title, text, button) {
    $('board').hidden = true; $('gate').hidden = false;
    $('gate').innerHTML = '<div class="card empty"><b>' + esc(title) + '</b>' + esc(text) + (button ? '<div style="margin-top:14px"><button class="b primary" type="button" id="gateBtn">' + esc(button) + '</button></div>' : '') + '</div>';
    $('lead').textContent = '';
  }

  function load() {
    return GVC_SHELL.onTeam().then(function (ok) {
      if (ok) return read();
      if (ok === null) return gate('Couldn\'t check your account', GVC_SHELL.CANT_CHECK);
      gate('Not on the team list', GVC_SHELL.NOT_ON_TEAM);
    });
  }
  function read() {
    return Promise.all([
      rest('/properties?select=id,slug,label,core,kind,market,stage,stage_source,de,de_status,de_listing_id,drive_folder,folder_state,asana_gid,asana,milestones,match,version&stage=not.is.null'),
      rest('/dev_projects?select=*'),
      rest('/asana_people?select=name,section,title,past,de_bio_url,de_profile_url,seen_at'),
      // lines that belong to no job: GVC-listed on DE with no job, and Asana tasks the last sync couldn't link
      // (either failing to read leaves those lines out, never the page)
      rest('/de_listings?select=de_listing_id,kind,gvc_listed,property_id,ignored,courtesy,raw,checked_at&gvc_listed=is.true&property_id=is.null&ignored=is.false').catch(function () { return []; }),
      rest('/sync_runs?select=kind,started_at,ok,totals&kind=eq.asana&ok=is.true&order=started_at.desc&limit=1').catch(function () { return []; }),
      rest('/asana_tasks?select=gid&ignored=eq.true').catch(function () { return []; }),
      // who claimed or fixed what (0011); missing before the migration: no claim buttons then
      rest('/match_claims?select=*').catch(function () { return null; }),
      rest('/sync_runs?select=started_at&ok=is.true&order=started_at.desc&limit=1').catch(function () { return []; }),
      P.whoAmI().catch(function () { return {}; })
    ]).then(function (r) {
      var people = r[2] || [], latest = people.reduce(function (m, p) { return p.seen_at && p.seen_at > m ? p.seen_at : m; }, '');
      // the newest good Asana run's unlinked tasks: a failed run's list is never trusted (tune-up B8)
      var run = (r[4] || []).filter(function (x) { return x.ok === true; })
        .sort(function (a, b) { return a.started_at < b.started_at ? 1 : -1; })[0] || null;
      var props = r[0] || [];
      // a DE listing a job's M19 ("probably the same listing") names: its line says which job
      var claims = {};
      W.buildJobs({ properties: props, pitches: [], devProjects: [], changes: [] }, today).forEach(function (j) {
        (j.match || []).forEach(function (m) { if (m.code === 'M19' && m.values && m.values.deListingId) claims[m.values.deListingId] = j.name; });
      });
      data = { properties: props, devProjects: r[1] || [], people: people.filter(function (p) { return (p.seen_at || '') === latest; }),
        // a task or DE listing linked to a job by hand since is no longer "not linked", even when only the job's half saved
        loose: W.looseMatch({ deListings: r[3] || [], asanaRun: run, ignoredGids: (r[5] || []).map(function (t) { return t.gid; }),
          linkedGids: props.map(function (p) { return p.asana_gid; }).filter(Boolean),
          linkedDeIds: props.map(function (p) { return p.de_listing_id; }).filter(Boolean), claims: claims }, M) };
      data.claims = null;
      if (r[6]) { data.claims = {}; r[6].forEach(function (c) { data.claims[c.owner_table + '|' + c.owner_id + '|' + c.key] = c; }); }
      data.lastSync = (r[7] || []).reduce(function (m, x) { return x && x.started_at && Date.parse(x.started_at) > Date.parse(m || 0) ? x.started_at : m; }, '');
      // only the marketing team and admins claim and fix (Matt, 10-23); the database says the same
      data.canFix = ['owner', 'admin', 'marketing'].indexOf((r[8] || {}).role) !== -1;
      data.links = {};
      data.loose.forEach(function (l) { if (l.item.link) data.links[l.item.key] = l.item; });
      render();
      $('gate').hidden = true; $('board').hidden = false;
    }, function (e) {
      if (e.status === 404 || e.status === 400 || /does not exist|schema cache/i.test(e.message)) {
        gate('The Asana tables aren\'t set up yet', 'Migration 0006 hasn\'t been applied to the database. Nothing is lost; this page fills in once it is.');
      } else gate('The Match page couldn\'t load', e.message);
    });
  }

  function line(it, fix) {
    var meta = [];
    if (it.since) meta.push('<span class="when">Since ' + esc(W.fmtDay(it.since)) + '</span>');
    if (it.asanaUrl && fix !== 'Roster') meta.push('<a class="link asana" href="' + esc(it.asanaUrl) + '" target="_blank" rel="noopener">Open in Asana</a>');
    if (it.deUrl) meta.push('<a class="link de" href="' + esc(it.deUrl) + '" target="_blank" rel="noopener">Open on DE</a>');
    if (it.paste) meta.push('<span>Paste: <span class="paste">' + esc(it.paste) + '</span></span><button class="lnk" type="button" data-copy="' + esc(it.paste) + '">Copy</button>');
    var cl = claimOf(it), waiting = false;
    if (cl && cl.fixed_at && !(Date.parse(data.lastSync) > Date.parse(cl.fixed_at))) {
      waiting = true;
      meta.unshift('<span class="claim">Fixed by ' + esc(cl.fixed_name || 'someone') + ' ' + esc(W.fmtDay(cl.fixed_at)) + ' · waiting for the next sync</span>');
      if (data.canFix) meta.push('<button class="lnk" type="button" data-unfix>Undo</button>');
    } else if (cl && cl.fixed_at) {
      meta.unshift('<span class="claim still">Still wrong after ' + esc(cl.fixed_name || 'someone') + ' marked it fixed ' + esc(W.fmtDay(cl.fixed_at)) + '</span>');
      if (data.canFix) meta.push('<button class="lnk do" type="button" data-fix>Mark fixed</button>');
    } else if (cl && cl.claimed_at) {
      meta.unshift('<span class="claim">' + esc(cl.claimed_name || 'Someone') + ' is on it</span>');
      if (data.canFix) meta.push('<button class="lnk do" type="button" data-fix>Mark fixed</button><button class="lnk" type="button" data-unclaim>Unclaim</button>');
    } else if (it.id && data.claims && data.canFix) {
      meta.push('<button class="lnk do" type="button" data-claim>I\'m on it</button>');
    }
    if (it.id) meta.push('<button class="lnk" type="button" data-dismiss>Dismiss</button>');
    // a line that belongs to no job: tie it to one, or set it aside (tune-up A)
    if (it.link && L) meta.push('<button class="lnk" type="button" data-link>Link to a job</button><button class="lnk" type="button" data-aside>' + (it.link.type === 'de' ? 'Not ours' : 'Ignore') + '</button>');
    return '<li class="mline' + (waiting ? ' waiting' : '') + '" data-key="' + esc(it.key) + '" data-id="' + esc(it.id || '') + '" data-table="' + esc(it.table || '') + '"><span class="code"' + (KEY[it.code] ? ' title="' + esc(KEY[it.code]) + '"' : '') + '>' + esc(it.code === 'roster' ? 'Roster' : it.code) + '</span><div>' +
      (it.href ? '<a class="job" href="../' + esc(it.href) + '">' + esc(it.job) + '</a>. ' : it.job && fix !== 'Roster' ? '<b>' + esc(it.job) + '</b>. ' : '') + esc(it.text) +
      (meta.length ? '<div class="meta">' + meta.join('') + '</div>' : '') +
      (it.id ? '<div class="dz" hidden><input class="inp reason" maxlength="200" placeholder="One line: why this is fine" aria-label="Reason for dismissing">' +
      '<button class="b sm primary" type="button" data-confirm>Dismiss</button><button class="b sm" type="button" data-cancel>Cancel</button></div>' : '') + '<p class="msg" role="alert"></p></div></li>';
  }

  function claimOf(it) { return it.id && data.claims ? data.claims[(it.table || 'properties') + '|' + it.id + '|' + it.key] || null : null; }

  /* I'm on it / Mark fixed / Unclaim / Undo: one row per error in match_claims; the database
     stamps the name and time of whoever is signed in */
  function claimSet(li, patch) {
    if (busy) return;
    var msg = li.querySelector('.msg'), table = li.dataset.table || 'properties', id = li.dataset.id, key = li.dataset.key;
    var body = Object.assign({ owner_table: table, owner_id: id, key: key }, patch);
    if (patch.fixed_at) {
      var row = (table === 'dev_projects' ? data.devProjects : data.properties).filter(function (x) { return x.id === id; })[0];
      var item = row && ((row.match || {}).list || []).filter(function (m) { return (m.key || m.code) === key; })[0];
      body.fixed_values = item && item.values !== undefined ? item.values : null;
    }
    busy = true; msg.textContent = 'Saving…';
    li.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    P.call('/rest/v1/match_claims?on_conflict=owner_table,owner_id,key', {
      method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal', body: JSON.stringify(body)
    }).then(function () { busy = false; return load(); }, function (e) {
      busy = false; msg.textContent = /row-level security|permission/i.test(e.message) ? 'Only the marketing team and admins can do this.' : e.message;
      li.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
    });
  }

  function render() {
    // Archived jobs are left out, as from the overview's total (tune-up B7)
    var jobs = W.buildJobs({ properties: data.properties, pitches: [], devProjects: data.devProjects, changes: [] }, today);
    data.names = {};
    jobs.forEach(function (j) { data.names[j.id] = j.name; });
    var drift = M && window.GVC_ROSTER ? M.rosterDrift(window.GVC_ROSTER, data.people) : [];
    var loose = data.loose || [];
    var groups = W.matchGroups(jobs, drift, loose), n = W.overviewStats(jobs).mismatches + loose.length;
    $('lead').textContent = (n ? n + ' error' + (n === 1 ? '' : 's') : 'No errors') +
      (drift.length ? ' · ' + drift.length + ' roster note' + (drift.length === 1 ? '' : 's') : '');
    if (!groups.length) { $('groups').innerHTML = '<div class="card empty"><b>Nothing to fix</b></div>'; return; }
    $('groups').innerHTML = groups.map(function (g) {
      var bulk = g.bulk || [];
      var count = g.people.reduce(function (a, p) { return a + p.items.length; }, 0) + bulk.reduce(function (a, b) { return a + b.items.length; }, 0);
      return '<section class="card mg" data-open><div class="card-h"><div><h2>' + esc(g.fixAt) + '</h2><p>' + esc(WHERE[g.fixAt] || '') + '</p></div><span class="chip made">' + count + '</span></div>' +
        bulk.map(function (b, i) {
          var id = 'bulk-' + esc(g.fixAt) + '-' + i;
          return '<div class="who bulk" data-key="' + esc(b.key) + '"><span class="code">' + esc(b.code) + '</span><div><b>' + esc(b.text) + '</b> ' +
            '<button class="lnk" type="button" data-bulk aria-expanded="false" aria-controls="' + id + '">Show the jobs</button>' +
            '<ul class="mm bulk-list" id="' + id + '" hidden>' + b.items.map(function (it) { return line(it, g.fixAt); }).join('') + '</ul></div></div>';
        }).join('') +
        g.people.map(function (p) {
          return '<div class="who">' + (g.fixAt === 'Roster' ? '' : '<h3>' + esc(p.who || 'No one named') + '</h3>') + '<ul class="mm">' + p.items.map(function (it) { return line(it, g.fixAt); }).join('') + '</ul></div>';
        }).join('') + '</section>';
    }).join('');
  }

  /* dismiss: a one-line reason, stored on the job's match.dismissed[key] with the values it was dismissed at */
  var busy = false;
  function dismiss(li) {
    var reason = li.querySelector('input.reason').value.trim(), msg = li.querySelector('.msg');
    if (!reason) { msg.textContent = 'Write a one-line reason first.'; li.querySelector('input.reason').focus(); return; }
    if (busy) return;
    var table = li.dataset.table, id = li.dataset.id, key = li.dataset.key;
    var row = (table === 'dev_projects' ? data.devProjects : data.properties).filter(function (x) { return x.id === id; })[0];
    var item = row && ((row.match || {}).list || []).filter(function (m) { return (m.key || m.code) === key; })[0];
    if (!item) { msg.textContent = 'This mismatch has changed since the page loaded. Reload the page.'; return; }
    busy = true; msg.textContent = 'Saving…';
    li.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    P.whoAmI().catch(function () { return { name: 'Matt' }; }).then(function (me) {
      var match = JSON.parse(JSON.stringify(row.match || {}));
      match.list = match.list || [];
      match.dismissed = match.dismissed || {};
      match.dismissed[key] = { values: item.values === undefined ? null : item.values, reason: reason, by: me.name, at: new Date().toISOString() };
      return P.call('/rest/v1/' + table + '?id=eq.' + encodeURIComponent(id) + '&version=eq.' + encodeURIComponent(row.version), {
        method: 'PATCH', prefer: 'return=representation', body: JSON.stringify({ match: match })
      }).then(function (rows) {
        if (!rows || !rows.length) throw new Error('Someone changed this job meanwhile. Reload the page and dismiss it again.');
        var c = {};
        c[OWNER[table]] = id;
        Object.assign(c, { field: 'match', old_value: key, new_value: null, note: 'Mismatch dismissed: ' + item.text + ' Reason: ' + reason, source: 'match' });
        return P.call('/rest/v1/changes', { method: 'POST', body: JSON.stringify(c) }).then(function () { busy = false; return load(); }, function (e) {
          busy = false;
          return load().then(function () { $('lead').textContent = 'Dismissed, but the change log didn\'t save (' + e.message + '). There\'s nothing to redo.'; });
        });
      });
    }).catch(function (e) {
      busy = false; msg.textContent = e.message;
      li.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
    });
  }

  /* Link to a job / Not ours / Ignore on a line that belongs to no job (GVC_MATCH_LINK) */
  function nameOf(row) { return data.names[row.id] || row.label || 'Untitled listing'; }
  function linkLine(li) {
    var it = data.links[li.dataset.key];
    if (!it || busy) return;
    L.open({ link: it.link, rows: data.properties, nameOf: nameOf, what: it.job }).then(function (ok) { if (ok) load(); });
  }
  function asideLine(li) {
    var it = data.links[li.dataset.key], msg = li.querySelector('.msg');
    if (!it || busy) return;
    busy = true; msg.textContent = 'Saving…';
    li.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    L.setAside(P, it.link).then(function () { busy = false; return load(); }, function (e) {
      busy = false;
      // set aside already; only the log failed: reload, then say so (as Dismiss does)
      if (e.linked) return load().then(function () { $('lead').textContent = e.message; });
      msg.textContent = e.message;
      li.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
    });
  }

  $('groups').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-link')) { linkLine(b.closest('.mline')); return; }
    if (b.hasAttribute('data-aside')) { asideLine(b.closest('.mline')); return; }
    if (b.hasAttribute('data-bulk')) {
      var list = document.getElementById(b.getAttribute('aria-controls')), open = list.hidden;
      list.hidden = !open; b.setAttribute('aria-expanded', String(open)); b.textContent = open ? 'Hide the jobs' : 'Show the jobs';
      return;
    }
    var li = b.closest('.mline');
    if (b.hasAttribute('data-copy')) {
      var v = b.dataset.copy;
      (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { b.textContent = 'Copied'; }, function () { b.textContent = 'Select the link to copy it'; });
    } else if (b.hasAttribute('data-dismiss')) {
      li.querySelector('.dz').hidden = false; b.hidden = true; li.querySelector('input.reason').focus();
    } else if (b.hasAttribute('data-cancel')) {
      li.querySelector('.dz').hidden = true; li.querySelector('[data-dismiss]').hidden = false; li.querySelector('.msg').textContent = '';
    } else if (b.hasAttribute('data-confirm')) dismiss(li);
    else if (b.hasAttribute('data-claim')) claimSet(li, { claimed_at: new Date().toISOString() });
    else if (b.hasAttribute('data-unclaim')) claimSet(li, { claimed_at: null });
    else if (b.hasAttribute('data-fix')) claimSet(li, { fixed_at: new Date().toISOString() });
    else if (b.hasAttribute('data-unfix')) claimSet(li, { fixed_at: null });
  });
  $('groups').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.classList.contains('reason')) { e.preventDefault(); dismiss(e.target.closest('.mline')); }
  });

  if (P.signedIn()) load();
  else {
    gate('Sign in', 'For the GVC team.', 'Sign in');
    $('gateBtn').addEventListener('click', function () { P.askSignIn('Sign in to open the workspace.').then(function (ok) { if (ok) { shell.paintMe(); load(); } }); });
  }
})();
</script>
</body>
</html>
