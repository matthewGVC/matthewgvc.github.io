<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status · GVC Workspace</title>
<meta name="description" content="Where every GVC property stands: stage, last milestone, next date, agents and mismatch count, for the team.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../assets/logos/monogram.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/logos/monogram-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/logos/apple-touch-icon-180.png">
<!-- Self-hosted STATIC fonts. See assets/css/fonts.css. -->
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/workspace.css">
<style>
#markets > * + *{margin-top:20px}
.mkt{padding:0;overflow:hidden}
.mkt .card-h{padding:18px 22px 0;margin-bottom:12px;align-items:baseline}
.mkt .card-h span{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.st .nm a{font-family:var(--serif);font-size:17px;overflow-wrap:anywhere}
.st .nm a:hover{text-decoration:underline;text-decoration-color:var(--sky);text-underline-offset:4px}
.st .dt{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.st .dt small{display:block;font-family:var(--body,var(--sans-body));font-size:12px;color:var(--ink-soft);white-space:normal}
.st .n{font-family:var(--mono);text-align:right}
.st .n.warn{color:var(--danger);font-weight:600}
@media (max-width:720px){
  .st thead{display:none}
  .st,.st tbody,.st tr,.st td{display:block;width:100%}
  .st tr{padding:12px 16px;border-bottom:1px solid var(--rule)}
  .st tr:last-child{border-bottom:0}
  .st td{border:0;padding:3px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;text-align:right}
  .st td.nm{display:block;text-align:left;padding-bottom:6px}
  .st td::before{content:attr(data-l);font-family:var(--sans-display);font-weight:800;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-soft);text-align:left;flex-shrink:0}
  .st td.nm::before{content:none}
  .st .dt{white-space:normal}
  .st tr:hover td{background:none}
}
</style>
</head>
<body data-nav="status" data-root="../">
<main class="wrap">
  <div class="page-h">
    <div>
      <div class="eyebrow">For the team</div>
      <h1>Status</h1>
      <p id="lead">Loading where every property stands…</p>
    </div>
    <div class="seg" role="group" aria-label="Market" id="mkt">
      <button type="button" aria-pressed="true" data-v="">All</button><button type="button" aria-pressed="false" data-v="NYC">NYC</button><button type="button" aria-pressed="false" data-v="NJ">NJ</button><button type="button" aria-pressed="false" data-v="FL">FL</button>
    </div>
  </div>
  <div id="gate" hidden></div>
  <div id="board" hidden><div id="markets"></div></div>
</main>
<script src="../../assets/js/supabase-config.js"></script>
<script src="../../assets/js/property-library.js"></script>
<script src="../../assets/js/roster.js"></script>
<script src="../../assets/js/drive-rules.js"></script>
<script src="../../assets/js/drive.js"></script>
<script src="../../assets/js/workspace-data.js"></script>
<script src="../../assets/js/workspace-shell.js"></script>
<script>
(function () {
  'use strict';
  var P = window.GVC_PROPS, W = window.GVC_WS, esc = window.GVC_ESC, $ = function (id) { return document.getElementById(id); };
  var today = W.today(), data = null, market = '';
  var shell = GVC_SHELL.mount({ noDrive: true, onSynced: function () { load(); } });

  function rest(path) { return P.call('/rest/v1' + path); }
  function gate(title, text, button) {
    $('board').hidden = true; $('gate').hidden = false;
    $('gate').innerHTML = '<div class="card empty"><b>' + esc(title) + '</b>' + esc(text) + (button ? '<div style="margin-top:14px"><button class="b primary" type="button" id="gateBtn">' + esc(button) + '</button></div>' : '') + '</div>';
    $('lead').textContent = '';
  }

  /* read-only: nothing on this page writes */
  function load() {
    return GVC_SHELL.onTeam().then(function (ok) {
      if (ok) return read();
      if (ok === null) return gate('Couldn\'t check your account', GVC_SHELL.CANT_CHECK);
      gate('Not on the team list', GVC_SHELL.NOT_ON_TEAM);
    });
  }
  function read() {
    return Promise.all([
      rest('/properties?select=id,slug,label,core,kind,market,stage,stage_source,de,de_status,de_listing_id,folder_state,asana_gid,asana,milestones,match,version&stage=not.is.null'),
      rest('/pitches?select=id,slug,label,market,pitched_on,outcome,won_property_id,folder_state,asana_gid')
    ]).then(function (r) {
      data = { properties: r[0] || [], pitches: r[1] || [], devProjects: [], changes: [] };
      render();
      $('gate').hidden = true; $('board').hidden = false;
    }, function (e) {
      if (e.status === 404 || e.status === 400 || /does not exist|schema cache/i.test(e.message)) {
        gate('The workspace tables aren\'t set up yet', 'The database isn\'t ready for this page yet. Nothing is lost; it fills in once it is.');
      } else gate('The Status page couldn\'t load', e.message);
    });
  }

  function when(x) { return x ? esc(x.label) + ' <small>' + esc(W.fmtDay(x.on)) + '</small>' : '<span class="soft">Not set</span>'; }

  function render() {
    var groups = W.statusRows(W.buildJobs(data, today)).filter(function (g) { return !market || g.market === market; });
    var n = groups.reduce(function (a, g) { return a + g.rows.length; }, 0);
    $('lead').textContent = n + ' propert' + (n === 1 ? 'y' : 'ies') + (market ? ' in ' + market : '') + ', by market and stage. Stages and dates come from Asana; the mismatch count says how many details still disagree.';
    if (!groups.length) { $('markets').innerHTML = '<div class="card empty"><b>No properties here</b>' + (data.properties.length + data.pitches.length ? 'Nothing in this market yet.' : 'They show here once Asana and DE fill the workspace.') + '</div>'; return; }
    $('markets').innerHTML = groups.map(function (g) {
      return '<section class="card mkt"><div class="card-h"><h2>' + esc(g.market || 'No market') + '</h2><span>' + g.rows.length + ' propert' + (g.rows.length === 1 ? 'y' : 'ies') + '</span></div>' +
        '<table class="tbl st"><thead><tr><th>Property</th><th>Stage</th><th>Last milestone</th><th>Next date</th><th>Agents</th><th class="r">Mismatches</th></tr></thead><tbody>' +
        g.rows.map(function (r) {
          return '<tr data-href="' + esc(r.href) + '"><td class="nm"><a href="../' + esc(r.href) + '">' + esc(r.name) + '</a></td>' +
            '<td class="stg" data-l="Stage"><span class="chip ' + esc(r.chip) + '">' + esc(r.stage) + '</span></td>' +
            '<td class="dt" data-l="Last milestone">' + when(r.lastMilestone) + '</td><td class="dt" data-l="Next date">' + when(r.nextDate) + '</td>' +
            '<td data-l="Agents">' + (r.agents.length ? esc(r.agents.join(', ')) : '<span class="soft">Not set</span>') + '</td>' +
            '<td class="n' + (r.mismatches ? ' warn' : '') + '" data-l="Mismatches">' + r.mismatches + '</td></tr>';
        }).join('') + '</tbody></table></section>';
    }).join('');
  }

  $('mkt').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    market = b.dataset.v; if (data) render();
  });

  if (P.signedIn()) load();
  else {
    gate('Sign in', 'The Status page is for the GVC team. Sign in with your own email and password.', 'Sign in');
    $('gateBtn').addEventListener('click', function () { P.askSignIn('Sign in to open the workspace.').then(function (ok) { if (ok) { shell.paintMe(); load(); } }); });
  }
})();
</script>
</body>
</html>
